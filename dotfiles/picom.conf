#====================================================#
#                picom.conf sample                   #
#====================================================#

#################################
#   NATIVE PICOM V12 ANIMATIONS #
#################################
animations = (
# 1. POP UP (Triggered when opening a new window)
  {
    triggers = ["open"];
    opacity = { curve = "linear"; duration = 0.15; start = 0.0; end = 1.0; };
    scale-x = { curve = "cubic-bezier(0.1, 0.9, 0.2, 1.1)"; duration = 0.15; start = 0.85; end = 1.0; };
    scale-y = { curve = "cubic-bezier(0.1, 0.9, 0.2, 1.1)"; duration = 0.15; start = 0.85; end = 1.0; };
    # These expressions force the pop animation to scale from the center instead of the top-left corner
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },
  
# 2. POP DOWN (Triggered when closing a window)
  {
    triggers = ["close"];
    opacity = { curve = "linear"; duration = 0.12; start = 1.0; end = 0.0; };
    scale-x = { curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)"; duration = 0.12; start = 1.0; end = 0.85; };
    scale-y = { curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)"; duration = 0.12; start = 1.0; end = 0.85; };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },

# 3. WORKSPACE SWITCH IN (Subtle quick-zoom in)
  {
    triggers = ["show"];
    opacity = { curve = "linear"; duration = 0.12; start = 0.0; end = 1.0; };
    scale-x = { curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)"; duration = 0.15; start = 0.94; end = 1.0; };
    scale-y = { curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)"; duration = 0.15; start = 0.94; end = 1.0; };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },

# 4. WORKSPACE SWITCH OUT (Subtle quick-zoom out)
  {
    triggers = ["hide"];
    opacity = { curve = "linear"; duration = 0.10; start = 1.0; end = 0.0; };
    scale-x = { curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)"; duration = 0.10; start = 1.0; end = 0.94; };
    scale-y = { curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)"; duration = 0.10; start = 1.0; end = 0.94; };
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
  },
# 5. TILING LAYOUT TRANSITIONS (Triggered on resize, tile swap, and monitor move)
  {
    triggers = ["geometry"];
    duration = 0.16;            # Snappy timing for layout changes
    
    # Smoothly animate the window's movement across X-axis positions
    offset-x = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.16;
      start = "window-x-before - window-x"; # Calculate distance moved horizontally
      end = 0;
    };
    
    # Smoothly animate the window's movement across Y-axis positions
    offset-y = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.16;
      start = "window-y-before - window-y"; # Calculate distance moved vertically
      end = 0;
    };
    
    # Smoothly animate scale adjustments when a window is resized or changes aspect ratio
    scale-x = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.16;
      start = "window-width-before / window-width"; # Match old width to new width
      end = 1.0;
    };
    scale-y = {
      curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
      duration = 0.16;
      start = "window-height-before / window-height"; # Match old height to new height
      end = 1.0;
    };
  }
)

#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#           Fading              #
#################################
fading = true;
# Accelerated fade steps so it matches the high-speed geometry transition
fade-in-step = 0.08;
fade-out-step = 0.08;

#################################
#   Transparency / Opacity      #
#################################
frame-opacity = 0.7;

#################################
#            Corners            #
#################################
corner-radius = 0;

#################################
#             Blur              #
#################################
blur: {
  method = "dual_kawase";
  strength = 4;
  background = true;
  background-frame = false;
  background-fixed = false;
};

blur-kern = "3x3box";

#################################
#       General Settings        #
#################################
backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

#################################
#        Window Rules           #
#################################
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
}, {
  match = "class_g = 'slop'";
  blur-background = false;
  fade = false;
  shadow = false;
  animations = (
    { triggers = ["open", "close", "show", "hide", "geometry"]; preset = "none"; }
  );
}, {
  match = "class_g = 'Boomer'";
  blur-background = false;
  fade = false;
  shadow = false;
  animations = (
    { triggers = ["open", "close", "show", "hide", "geometry"]; preset = "none"; }
  );
}, {
  match = "class_g = 'dmenu'";
  animations = (
    {
      triggers = ["open"];
      opacity = { curve = "linear"; duration = 0.15; start = 0.0; end = 1.0; };
      offset-y = { curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)"; duration = 0.15; start = -30; end = 0; };
    },
    {
      triggers = ["close"];
      opacity = { curve = "linear"; duration = 0.12; start = 1.0; end = 0.0; };
      offset-y = { curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)"; duration = 0.12; start = 0; end = -30; };
    }
  );
}, {
  match = "(window_state = 'fullscreen' || _NET_WM_STATE@:a *= '_NET_WM_STATE_FULLSCREEN') && (class_g = 'st-256color' || class_g = 'st')";
  blur = {
    method = "dual_kawase";
    strength = 100;
    background = true;
  };
  dim = 0.2;
  shadow = false;
})